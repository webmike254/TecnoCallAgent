name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout TecnoCallAgent
        uses: actions/checkout@v4
        with:
          path: TecnoCallAgent
      - name: Checkout upstream Android gateway source
        uses: actions/checkout@v4
        with:
          repository: sparkcyf/android-voice-sip-agent
          ref: main
          path: upstream
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;platforms;android-37;build-tools;36.0.0;ndk;28.2.13676358'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y swig build-essential pkg-config libssl-dev
      - name: Run JVM tests
        working-directory: upstream
        run: ./gradlew :sip:test :gateway:test
      - name: Build PJSIP native libraries
        working-directory: upstream
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          APP_PLATFORM: android-30
          ABIS: arm64-v8a
        run: sip-pjsua2/native/build-pjsua2.sh
      - name: Assemble debug APK
        working-directory: upstream
        run: ./gradlew :app:assembleDebug
      - name: Stage versioned APK
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" == "main" ]]; then VERSION="build-${GITHUB_RUN_NUMBER}"; fi
          mkdir -p TecnoCallAgent/dist
          cp upstream/app/build/outputs/apk/debug/*.apk "TecnoCallAgent/dist/TecnoCallAgent-${VERSION}.apk"
          cp "TecnoCallAgent/dist/TecnoCallAgent-${VERSION}.apk" TecnoCallAgent/dist/TecnoCallAgent-latest.apk
          printf 'Version: %s\nUpstream: https://github.com/sparkcyf/android-voice-sip-agent\nUpstream commit: %s\nBuild type: debug APK\nAndroid: upstream minSdk 30 (Android 11+)\nArchitecture: arm64-v8a\nAI/POS integration: not yet included in this APK.\n' "$VERSION" "$(git -C upstream rev-parse HEAD)" > TecnoCallAgent/dist/BUILD-INFO.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TecnoCallAgent-${{ steps.stage.outputs.version }}
          path: TecnoCallAgent/dist/
          retention-days: 30
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TecnoCallAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            TecnoCallAgent/dist/TecnoCallAgent-${{ github.ref_name }}.apk
            TecnoCallAgent/dist/BUILD-INFO.txt
